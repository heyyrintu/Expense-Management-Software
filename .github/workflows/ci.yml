name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U expense -d expense_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # app role — RLS enforced (created below); used by the isolation suite
      DATABASE_URL: postgresql://expense_app:expense_app@localhost:5432/expense_dev?schema=public
      # owner — migrations + fixture provisioning, and `npm run seed`
      DIRECT_DATABASE_URL: postgresql://expense:expense@localhost:5432/expense_dev?schema=public
      AUTH_SECRET: ci-only-secret
      # Required once CI actually signs in (G4). Auth.js builds its callback
      # URLs from this; without it the e2e login redirects to the wrong origin
      # and the run fails somewhere unhelpful, several steps later.
      AUTH_URL: http://localhost:3000
      # Required once the browser suites serve a PRODUCTION build: lib/env.ts
      # refuses to boot in production without it, because an unconfigured
      # deployment would expose job endpoints that mutate every org's data.
      CRON_SECRET: ci-only-cron-secret
      # Receipt store for the isolation + e2e suites. Started as a step
      # below rather than a `services:` entry: the minio image needs the
      # `server /data` command, and GitHub service containers cannot set one.
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET: receipts
      S3_FORCE_PATH_STYLE: "true"
      # Deliberately NOT setting APP_ENCRYPTION_KEY: /settings/whatsapp renders
      # its "set this before saving credentials" callout when the key is
      # absent, and that callout is a real state the axe scan should see.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint (eslint + tsc)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test

      # ── THE MIGRATION REPLAY PROOF ────────────────────────────────────────
      # The postgres service above is a fresh, empty container on every run, so
      # this step IS the end-to-end proof that the migration history replays.
      # It is the only check that would have caught `20260819044600_dep`, which
      # sorted before the migrations creating the objects it altered and failed
      # with P3006/P1014 on any database that did not already have them.
      #
      # It did not catch it in practice, for a reason worth writing down: that
      # migration reached origin/master on 2026-08-20, and nothing has been
      # pushed since. So this job has been RED since then, and then stopped
      # running at all. `npm run lint` now carries a database-free version of
      # the same check (scripts/check-migration-order.mjs) precisely because a
      # guard that needs a green pipeline cannot protect the pipeline.
      - name: Migrate (replays the full history against an empty database)
        run: npx prisma migrate deploy

      - name: Replay the history on a THROWAWAY empty database
        # Independent of the step above, and the stronger proof: a genuinely
        # empty database, created here and used for nothing else.
        #
        # The step above runs against the same database the isolation suite
        # then uses, so it stays green once the objects exist. This one cannot
        # — it starts empty every time, so an out-of-order migration fails it
        # on the first run and every run after.
        #
        # Deliberately NOT `prisma migrate diff --shadow-database-url`: that
        # RESETS whatever database it is pointed at, and pointing it at the
        # working database would destroy the fixtures the later steps need.
        run: |
          set -euo pipefail
          PGPASSWORD=expense psql -h localhost -U expense -d postgres \
            -c 'DROP DATABASE IF EXISTS replay_check;'
          PGPASSWORD=expense psql -h localhost -U expense -d postgres \
            -c 'CREATE DATABASE replay_check;'
          DATABASE_URL='postgresql://expense:expense@localhost:5432/replay_check?schema=public' \
          DIRECT_DATABASE_URL='postgresql://expense:expense@localhost:5432/replay_check?schema=public' \
            npx prisma migrate deploy
          PGPASSWORD=expense psql -h localhost -U expense -d postgres \
            -c 'DROP DATABASE replay_check;'

      - name: Create app role (RLS-enforced, non-superuser)
        run: PGPASSWORD=expense psql -h localhost -U expense -d expense_dev -f docker/postgres-init/01-app-role.sql

      - name: Start MinIO (receipt store)
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000             -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin             minio/minio:latest server /data
          for _ in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 1
          done
          curl -sf http://localhost:9000/minio/health/live
          # --entrypoint sh is required: the minio/mc image sets `mc` as its
          # ENTRYPOINT, so a bare `sh -c ...` is parsed as an mc subcommand
          # and fails with "`sh` is not a recognized command".
          docker run --rm --network host --entrypoint sh minio/mc:latest -c             "mc alias set local http://localhost:9000 minioadmin minioadmin &&              mc mb --ignore-existing local/receipts"

      - name: Tenant isolation suite (red build on any cross-tenant access)
        run: npm run test:isolation

      # ── Browser suites (G4) ────────────────────────────────────────────────
      # These existed in package.json from 4.3 and D5.3 and no workflow ever
      # invoked them, so the happy path and the axe scan could rot without
      # anyone noticing — and did: the a11y suite's route list had drifted to
      # 18 of the app's 29 id-less routes before tests/unit/a11y-coverage.test.ts
      # started failing the build for it.
      #
      # They run AFTER the isolation suite deliberately. Both need a working
      # database, and a cross-tenant leak is a more urgent signal than a
      # focus-order regression — if isolation is red, nothing below it matters.
      - name: Install Playwright browsers
        # Chromium only: the suites assert semantics and structure (roles,
        # names, focus, axe rules), none of which differ across engines. A
        # three-browser matrix would triple the slowest job in CI to re-check
        # the same DOM.
        run: npx playwright install --with-deps chromium

      - name: Seed demo data
        # The e2e run signs up its own org, but `npm run seed` provisions the
        # two demo orgs (acme, globex) the app's guards and role variants are
        # written against — a dashboard with no rows exercises the empty state
        # and nothing else.
        run: npm run seed

      # The browser suites sign up four orgs between them, and in CI every
      # request comes from localhost — so they all share ONE signup bucket
      # (5/hour/IP) that the isolation suite has also been writing to. That
      # is an artifact of the test environment, not a property under test:
      # the limiter's behaviour is proven by tests/isolation/rate-limit.test.ts,
      # which asserts the count lives in Postgres and is shared.
      #
      # Clearing the table is NOT disabling the limiter — the suites below
      # run against it normally, from zero.
      # The counters are SHARED now (that is the fix), and in CI every request
      # comes from localhost — so all three suites draw on one signup bucket
      # of 5/hour. `npm run test:e2e` runs every spec in tests/e2e, which is
      # ~3 signups, and the a11y step then re-runs its own 2: exactly at the
      # limit, with the weighted previous window able to tip it over. Each
      # suite therefore starts from zero.
      #
      # This is NOT disabling the limiter. The suites run against it
      # normally; its behaviour is proved by tests/isolation/rate-limit.test.ts,
      # which asserts the count lives in Postgres and is shared. Sharing one
      # IP is an artifact of the runner, not a property under test.
      - name: Clear rate-limit counters
        run: |
          PGPASSWORD=expense psql -h localhost -U expense -d expense_dev             -c 'DELETE FROM rate_limit_counters;'

      - name: E2E happy path (signup → submit → approve → reimburse)
        # Playwright starts the dev server itself (see playwright.config.ts
        # `webServer`), so there is no separate start step to keep in sync.
        run: npm run test:e2e

      - name: Clear rate-limit counters (again — see above)
        run: |
          PGPASSWORD=expense psql -h localhost -U expense -d expense_dev             -c 'DELETE FROM rate_limit_counters;'

      - name: Accessibility suite (axe, WCAG 2.1 AA)
        run: npm run test:a11y

      - name: Upload Playwright report
        # `always()`: the report is worth most precisely when the step above
        # failed, and the default `success()` would throw it away exactly then.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
